services:
  # PostgreSQL Database service
  postgres-db:
    image: postgres:15
    container_name: photoalbum-postgres
    environment:
      - POSTGRES_DB=${PGDATABASE}
      - POSTGRES_USER=${MANAGED_IDENTITY_NAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - photoalbum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MANAGED_IDENTITY_NAME} -d ${PGDATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Photo Album Java Application  
  photoalbum-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoalbum-java-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PGHOST=postgres-db
      - PGPORT=5432
      # Set the following environment variables before running (e.g. via .env file or Azure deployment config):
      # PGDATABASE=<your-database-name>
      # MANAGED_IDENTITY_NAME=<your-managed-identity-username>
      # MANAGED_IDENTITY_CLIENT_ID=<your-managed-identity-client-id>
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - photoalbum-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  photoalbum-network:
    driver: bridge
