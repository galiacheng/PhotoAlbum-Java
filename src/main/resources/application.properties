# Spring Boot Configuration
server.port=8080

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# PostgreSQL Database Configuration (Azure Database for PostgreSQL)
# Remember to set the environment variables used in the JDBC URL below.
# Required environment variables for managed identity URL:
#   PGHOST=<azure-postgresql-host>
#   PGPORT=5432
#   PGDATABASE=<database-name>
#   MANAGED_IDENTITY_NAME=<managed-identity-or-entra-principal-name>
#   MANAGED_IDENTITY_CLIENT_ID=<managed-identity-client-id>
# For Azure sovereign cloud, add the following URL parameters if needed:
#   azure.scopes
#     - azure_china: https://ossrdbms-aad.database.chinacloudapi.cn/.default
#     - azure_germany: https://ossrdbms-aad.database.cloudapi.de/.default
#     - azure_us_government: https://ossrdbms-aad.database.usgovcloudapi.net/.default
#     - azure: https://ossrdbms-aad.database.windows.net/.default
#   azure.authorityHost
#     - azure_china: https://login.partner.microsoftonline.cn
#     - azure_germany: https://login.microsoftonline.de
#     - azure_us_government: https://login.microsoftonline.us
#     - azure: https://login.microsoftonline.com
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?user=${MANAGED_IDENTITY_NAME}&sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&azure.managedIdentityEnabled=true&azure.clientId=${MANAGED_IDENTITY_CLIENT_ID}
# Comment out all content about username and password because PostgreSQL authenticates using managed identity.
# spring.datasource.username=
# spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
# Example URL for authentication by Service Principal instead of Managed Identity
# Required environment variables for service principal URL:
#   PGHOST, PGPORT, PGDATABASE
#   SERVICE_PRINCIPAL_NAME=<service-principal-display-name-or-upn>
#   SERVICE_PRINCIPAL_CLIENT_ID=<service-principal-client-id>
#   SERVICE_PRINCIPAL_CLIENT_SECRET=<service-principal-client-secret>
#   SERVICE_PRINCIPAL_TENANT_ID=<tenant-id>
# spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?user=${SERVICE_PRINCIPAL_NAME}&sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&azure.clientId=${SERVICE_PRINCIPAL_CLIENT_ID}&azure.clientSecret=${SERVICE_PRINCIPAL_CLIENT_SECRET}&azure.tenantId=${SERVICE_PRINCIPAL_TENANT_ID}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Application Configuration - File Upload Validation
app.file-upload.max-file-size-bytes=10485760
app.file-upload.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
app.file-upload.max-files-per-upload=10

# Logging
logging.level.com.photoalbum=DEBUG
logging.level.org.springframework.web=DEBUG
