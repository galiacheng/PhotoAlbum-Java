# Spring Boot Configuration
server.port=8080

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# PostgreSQL Database Configuration (Azure Database for PostgreSQL)
# 1. Do not set spring.datasource.password; access token is retrieved automatically.
# 2. For system-assigned managed identity only, spring.cloud.azure.credential.client-id can be omitted.
# 3. For service principal auth, remove spring.cloud.azure.credential.managed-identity-enabled and add:
#    spring.cloud.azure.profile.tenant-id=${SERVICE_PRINCIPAL_TENANT_ID}
#    spring.cloud.azure.credential.client-id=${SERVICE_PRINCIPAL_CLIENT_ID}
#    spring.cloud.azure.credential.client-secret=${SERVICE_PRINCIPAL_CLIENT_SECRET}
# 4. For Azure sovereign cloud, set:
#    spring.cloud.azure.profile.cloud-type=azure_china / azure_germany / azure_us_government / azure
#    spring.datasource.azure.scopes=<scope-for-your-cloud>
#      azure_china: https://ossrdbms-aad.database.chinacloudapi.cn/.default
#      azure_germany: https://ossrdbms-aad.database.cloudapi.de/.default
#      azure_us_government: https://ossrdbms-aad.database.usgovcloudapi.net/.default
#      azure: https://ossrdbms-aad.database.windows.net/.default
# 5. Remember to set environment variables used below.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslMode=REQUIRED
spring.datasource.username=${MANAGED_IDENTITY_NAME}
spring.datasource.azure.passwordless-enabled=true
spring.cloud.azure.credential.client-id=${MANAGED_IDENTITY_CLIENT_ID}
spring.cloud.azure.credential.managed-identity-enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver
# Example URL for authentication by Service Principal instead of Managed Identity
# Required environment variables for service principal URL:
#   PGHOST, PGPORT, PGDATABASE
#   SERVICE_PRINCIPAL_NAME=<service-principal-display-name-or-upn>
#   SERVICE_PRINCIPAL_CLIENT_ID=<service-principal-client-id>
#   SERVICE_PRINCIPAL_CLIENT_SECRET=<service-principal-client-secret>
#   SERVICE_PRINCIPAL_TENANT_ID=<tenant-id>
# spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslMode=REQUIRED
# spring.datasource.username=${SERVICE_PRINCIPAL_NAME}
# spring.datasource.azure.passwordless-enabled=true
# spring.cloud.azure.profile.tenant-id=${SERVICE_PRINCIPAL_TENANT_ID}
# spring.cloud.azure.credential.client-id=${SERVICE_PRINCIPAL_CLIENT_ID}
# spring.cloud.azure.credential.client-secret=${SERVICE_PRINCIPAL_CLIENT_SECRET}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Application Configuration - File Upload Validation
app.file-upload.max-file-size-bytes=10485760
app.file-upload.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
app.file-upload.max-files-per-upload=10

# Logging
logging.level.com.photoalbum=DEBUG
logging.level.org.springframework.web=DEBUG
