# Spring Boot Configuration
server.port=8080

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# PostgreSQL Database Configuration
# Remember to set values for PGHOST, PGPORT, PGDATABASE, MANAGED_IDENTITY_NAME, and MANAGED_IDENTITY_CLIENT_ID
# in your runtime environment (for example: shell export, CI/CD variables, or Azure App Service/Container App settings).
# In Azure App Service or Azure Container Apps, configure these as application settings/environment variables.
# If any of these variables are missing, datasource initialization will fail at startup.
# For Azure sovereign cloud, add parameters:
# azure.scopes and azure.authorityHost according to your cloud environment.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?\
user=${MANAGED_IDENTITY_NAME}&\
sslmode=require&\
authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&\
azure.managedIdentityEnabled=true&\
azure.clientId=${MANAGED_IDENTITY_CLIENT_ID}
# Comment out username/password because PostgreSQL uses managed identity authentication.
# spring.datasource.username=photoalbum
# spring.datasource.password=photoalbum
# Example URL for authentication by Service Principal instead of Managed Identity:
# spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?user=${SERVICE_PRINCIPAL_NAME}&sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&azure.clientId=${SERVICE_PRINCIPAL_CLIENT_ID}&azure.clientSecret=${SERVICE_PRINCIPAL_CLIENT_SECRET}&azure.tenantId=${SERVICE_PRINCIPAL_TENANT_ID}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Application Configuration - File Upload Validation
app.file-upload.max-file-size-bytes=10485760
app.file-upload.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
app.file-upload.max-files-per-upload=10

# Logging
logging.level.com.photoalbum=DEBUG
logging.level.org.springframework.web=DEBUG
