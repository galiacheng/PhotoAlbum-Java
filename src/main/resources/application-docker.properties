# Docker-specific configuration for PostgreSQL
# Remember to set values for POSTGRESQL_SERVER, POSTGRESQL_PORT, POSTGRESQL_DATABASE,
# MANAGED_IDENTITY_NAME, and MANAGED_IDENTITY_CLIENT_ID.
# If any of these variables are missing, datasource initialization will fail at startup.
# 1. Do not set spring.datasource.password, access token will be retrieved automatically and used as password.
# 2. For system-assigned managed identity only, spring.cloud.azure.credential.client-id can be omitted.
# 3. For service principal auth, remove spring.cloud.azure.credential.managed-identity-enabled and add:
#    spring.cloud.azure.profile.tenant-id=${SERVICE_PRINCIPAL_TENANT_ID}
#    spring.cloud.azure.credential.client-id=${SERVICE_PRINCIPAL_CLIENT_ID}
#    spring.cloud.azure.credential.client-secret=${SERVICE_PRINCIPAL_CLIENT_SECRET}
# 4. For Azure sovereign clouds, set:
#    spring.cloud.azure.profile.cloud-type=azure_china / azure_germany / azure_us_government / azure
#    spring.datasource.azure.scopes=<scope-for-your-cloud>
#      azure_china: https://ossrdbms-aad.database.chinacloudapi.cn/.default
#      azure_germany: https://ossrdbms-aad.database.cloudapi.de/.default
#      azure_us_government: https://ossrdbms-aad.database.usgovcloudapi.net/.default
#      azure: https://ossrdbms-aad.database.windows.net/.default
spring.datasource.url=jdbc:postgresql://${POSTGRESQL_SERVER}.postgresql.database.azure.com:${POSTGRESQL_PORT}/${POSTGRESQL_DATABASE}?sslMode=REQUIRED
spring.datasource.username=${MANAGED_IDENTITY_NAME}
spring.datasource.azure.passwordless-enabled=true
spring.cloud.azure.credential.client-id=${MANAGED_IDENTITY_CLIENT_ID}
spring.cloud.azure.credential.managed-identity-enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JPA Configuration for Docker
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration - Validation only (photos stored in PostgreSQL)
app.file-upload.max-file-size-bytes=10485760
app.file-upload.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
app.file-upload.max-files-per-upload=10

# Other settings remain the same
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.file-upload.max-file-size-bytes=10485760
app.file-upload.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
app.file-upload.max-files-per-upload=10

# Logging for Docker
logging.level.com.photoalbum=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG
